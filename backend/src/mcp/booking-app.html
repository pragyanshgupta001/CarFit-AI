<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ROAM Booking</title>
  <style>
    :root { --coral:#db6f45; --ink:#20302d; --muted:#687771; --line:#cbd6cf; --mint:#e8eee9; }
    * { box-sizing: border-box; }
    body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--ink); margin: 0; padding: 20px; background: #fffaf6; }
    h2 { margin: 0 0 6px; font: 400 24px Georgia, serif; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .vehicle { background: var(--mint); padding: 12px 14px; margin-bottom: 16px; border-left: 3px solid var(--coral); }
    .vehicle strong { display: block; font: 400 18px Georgia, serif; }
    .vehicle span { color: var(--muted); font-size: 12px; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    input { display: block; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font: 14px Georgia, serif; color: var(--ink); outline: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { margin-top: 20px; width: 100%; padding: 14px 18px; border: 0; background: var(--coral); color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .badge { display: inline-block; margin-bottom: 12px; padding: 4px 8px; background: #20302d; color: #fff; font-size: 10px; letter-spacing: .12em; }
  </style>
</head>
<body>
  <span class="badge">MCP APP · BOOKING</span>
  <h2>Reserve your selected car</h2>
  <p class="lead">Demo booking only. Trip details were captured during the interview.</p>
  <div class="vehicle" id="vehicle"><strong>Selected vehicle</strong><span>Loading…</span></div>
  <form id="booking">
    <div class="grid">
      <label>Name<input name="name" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
    </div>
    <label>Phone<input name="phone" autocomplete="tel"></label>
    <button type="submit">Continue to demo checkout</button>
  </form>
  <script>
    const vehicle = document.querySelector("#vehicle");
    window.addEventListener("message", (event) => {
      if (event.data?.type !== "mcp_app_init") return;
      const listing = event.data.data?.listing;
      const prefs = event.data.data?.preferences || {};
      if (listing) {
        vehicle.innerHTML = `<strong>${listing.brand} ${listing.model}</strong><span>${listing.category} · ${prefs.startDate || ""}${prefs.endDate ? " → " + prefs.endDate : ""}</span>`;
      }
    });
    window.parent.postMessage({ type: "mcp_app_ready", app: "booking" }, "*");
    document.querySelector("#booking").addEventListener("submit", (event) => {
      event.preventDefault();
      const button = event.target.querySelector("button");
      button.disabled = true;
      window.parent.postMessage({
        type: "mcp_app_action",
        action: "submit_booking",
        data: Object.fromEntries(new FormData(event.target))
      }, "*");
    });
  </script>
</body>
</html>
